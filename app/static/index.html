<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Infra Agent</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="sidebar-header">
      <h1>Infra Agent</h1>
      <div id="server-status" class="status-dot" title="Checking..."></div>
    </div>
    <button type="button" id="new-btn" onclick="resetForm()">+ New Job</button>
    <div id="job-list"><div class="empty-state">No jobs yet</div></div>
  </aside>
  <main>
    <div id="form-view">
      <h2>Describe your infrastructure</h2>
      <p class="subtitle">Use natural language — the agent figures out the rest.</p>
      <textarea id="prompt" rows="4" placeholder="e.g. an S3 bucket with versioning and encryption, or a VPC with public/private subnets and an EC2 instance..."></textarea>
      <div class="options">
        <label><input type="checkbox" id="skip-git"> Skip git</label>
        <label><input type="checkbox" id="skip-jenkins"> Skip Jenkins</label>
      </div>
      <button type="button" id="submit-btn" onclick="submitJob()">Generate</button>
      <div id="error-msg" class="error hidden"></div>
    </div>
    <div id="result-view" class="hidden">
      <div class="pipeline-bar" id="pipeline-bar">
        <div class="pipe-node" data-pipe="clone"><div class="pipe-dot"></div><span>Clone</span></div>
        <div class="pipe-connector"></div>
        <div class="pipe-node" data-pipe="generate"><div class="pipe-dot"></div><span>Generate</span></div>
        <div class="pipe-connector"></div>
        <div class="pipe-node" data-pipe="publish"><div class="pipe-dot"></div><span>Publish</span></div>
      </div>
      <div class="result-header">
        <h2>Job <span id="job-id-display"></span></h2>
        <span id="job-status-badge" class="badge">queued</span>
        <span id="job-elapsed" style="font-size:12px;color:var(--text-muted);margin-left:8px"></span>
        <select id="status-select" class="status-select hidden" onchange="transitionJob(currentJobId, this.value)"></select>
        <button type="button" id="cancel-btn" class="btn-danger hidden" onclick="cancelJob(currentJobId)">Cancel</button>
      </div>
      <div id="conversation-view"></div>
    </div>
  </main>
</div>
<script src="/static/app.js"></script>
</body>
</html>
