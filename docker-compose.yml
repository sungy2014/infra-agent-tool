services:
  infra-agent:
    build: .
    container_name: infra-agent
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      JENKINS_URL: http://jenkins:8080
      HOME: /app
      INFRA_AGENT_DB_PATH: /tmp/infra_agent.db
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          memory: 256M
    volumes:
      - agent_repo:/app/repo
      - ~/.gitconfig:/app/.gitconfig:ro
      - ~/.git-credentials:/app/.git-credentials:ro

  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins-server
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home

volumes:
  jenkins_home:
  agent_repo:
