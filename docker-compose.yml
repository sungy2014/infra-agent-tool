services:
  infra-agent:
    build: .
    container_name: infra-agent
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      JENKINS_URL: http://jenkins:8080
      HOME: /app
      DATABASE_URL: postgresql://infra:infra@postgres:5432/infra
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          memory: 256M
    volumes:
      - agent_repo:/app/repo
      - ~/.gitconfig:/app/.gitconfig:ro
      - ~/.git-credentials:/app/.git-credentials:ro
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: infra-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: infra
      POSTGRES_PASSWORD: infra
      POSTGRES_DB: infra
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infra"]
      interval: 5s
      timeout: 3s
      retries: 5

  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins-server
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home

volumes:
  jenkins_home:
  agent_repo:
  pg_data:
